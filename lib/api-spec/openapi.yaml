      type: object
      properties:
        objectPath:
          type: string
        url:
          type: string
        format:
          type: string
          description: "mp4 | webm | gif (webm when the host has no ffmpeg)"
        contentType:
          type: string
        bytes:
          type: integer
      required:
        - objectPath
        - url
        - format
        - contentType

    ClientUploadInfo:
      type: object
      description: >
        Present when file storage is Vercel Blob. The client should upload via
        @vercel/blob/client upload() with these parameters instead of PUTting
        to uploadURL — direct-to-store uploads bypass the serverless
        request-body size limit.
      properties:
        handleUploadUrl:
          type: string
        pathname:
          type: string
      required:
        - handleUploadUrl
        - pathname

